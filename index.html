<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Discreto: A Jornada do Algoritmo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        .conteudo-oculto { filter: blur(6px); pointer-events: none; user-select: none; transition: filter 0.3s ease; }
        .conteudo-visivel { filter: blur(0); pointer-events: auto; user-select: text; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-4 font-sans relative">

    <div id="modal-inicio" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-2xl font-bold text-indigo-400 mb-2">Configuração do Jogo</h2>
            <p class="text-slate-400 text-sm mb-6">Quantos programadores vão disputar a jornada pelo Mundo Discreto?</p>
            
            <div class="flex items-center justify-center gap-4 mb-6">
                <label class="text-sm font-bold uppercase text-slate-300">Jogadores:</label>
                <input type="number" id="qtd-jogadores" value="2" min="2" max="6" class="w-20 bg-slate-900 border border-slate-600 rounded-lg p-2 text-center text-xl text-white font-bold focus:outline-none focus:border-indigo-500">
            </div>

            <button onclick="iniciarJogoComConfig()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-md border-b-4 border-indigo-800 cursor-pointer uppercase tracking-wider text-sm">
                Compilar e Iniciar 🚀
            </button>
        </div>
    </div>

    <header class="max-w-6xl w-full mx-auto mb-6 flex flex-col sm:flex-row justify-between items-center border-b border-slate-700 pb-4 gap-4">
        <h1 class="text-2xl font-bold text-indigo-400 tracking-wider uppercase">Mundo Discreto</h1>
        <div class="flex gap-4">
            <button onclick="alternarTela('tela-jogo')" id="btn-tela-jogo" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-2.5 rounded-lg transition shadow-md cursor-pointer border-b-4 border-slate-900">
                🎮 Jogar Localmente
            </button>
            <button onclick="alternarTela('tela-busca')" id="btn-tela-busca" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2.5 rounded-lg transition shadow-md cursor-pointer border-b-4 border-indigo-800">
                🔍 Consultar Cartas
            </button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto flex-1 flex justify-center items-center">
        
        <section id="tela-busca" class="w-full max-w-md text-center">
            <h2 class="text-2xl font-bold mb-2 text-indigo-400">Consulta de Cartas</h2>
            <div class="bg-slate-800 p-4 rounded-xl mb-6 border border-slate-700 flex gap-3 items-end justify-center">
                <div class="text-left w-20">
                    <label class="text-xs font-bold uppercase text-slate-400 block mb-1">ID Carta</label>
                    <input type="number" id="busca-id" value="1" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-center text-white text-lg focus:outline-none focus:border-indigo-500">
                </div>
                <div class="text-left w-20">
                    <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Ordem</label>
                    <input type="number" id="busca-ordem" value="1" min="1" max="4" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-center text-white text-lg focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="buscarCartaManual()" class="bg-indigo-600 hover:bg-indigo-500 transition text-white font-bold px-5 py-2.5 rounded h-12 flex items-center justify-center text-base cursor-pointer shadow-md">
                    Buscar 🔍
                </button>
            </div>
            <div id="busca-card-container" class="card-flip w-full h-[480px] cursor-pointer hidden"></div>
        </section>

        <section id="tela-jogo" class="w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start hidden">
            
            <div class="lg:col-span-7 bg-slate-950 p-4 rounded-2xl border border-slate-800 shadow-2xl">
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="p-2 bg-blue-950/40 border border-blue-500/30 rounded-lg text-center text-xs text-blue-400 font-bold">1. LÓGICA (1-25)</div>
                    <div class="p-2 bg-yellow-950/40 border border-yellow-500/30 rounded-lg text-center text-xs text-yellow-500 font-bold">2. PROVA DIRETA (26-50)</div>
                    <div class="p-2 bg-green-950/40 border border-green-500/30 rounded-lg text-center text-xs text-green-400 font-bold">3. INDUÇÃO (51-75)</div>
                    <div class="p-2 bg-red-950/40 border border-red-500/30 rounded-lg text-center text-xs text-red-400 font-bold">4. CONTRAPOSITIVA (76-100)</div>
                </div>

                <div id="tabuleiro" class="grid grid-cols-10 gap-1.5 p-2 bg-slate-900 rounded-xl overflow-hidden aspect-square max-h-[500px] mx-auto"></div>

                <div id="paineis-jogadores" class="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-900 p-3 rounded-xl text-xs border border-slate-800"></div>
            </div>

            <div class="lg:col-span-5 flex flex-col gap-4 w-full">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg grid grid-cols-2 gap-2">
                    <button onclick="rolarDados()" id="btn-dados" class="bg-amber-600 hover:bg-amber-500 border-b-4 border-amber-800 font-bold p-3 rounded-lg flex flex-col items-center justify-center gap-1 transition active:scale-95 cursor-pointer text-xs uppercase text-white">
                        <span>🎲 Rolar Dados</span>
                        <span id="resultado-dados" class="text-lg bg-slate-950/60 px-2 py-0.5 rounded text-amber-300">--</span>
                    </button>
                    <button onclick="sortearCartaTabuleiro()" id="btn-sortear" disabled class="bg-slate-600 opacity-50 border-b-4 border-slate-800 font-bold p-3 rounded-lg flex flex-col items-center justify-center gap-1 transition text-xs uppercase text-white">
                        <span>🃏 Tirar Carta</span>
                        <span id="regiao-atual-txt" class="text-xxs text-indigo-200">Aguardando Dados</span>
                    </button>
                </div>

                <div id="deck-tatico-container" class="bg-slate-950 p-3 rounded-xl border border-purple-900/40 hidden">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-purple-400 mb-2 text-center border-b border-purple-950 pb-1">⚙️ QG de Cartas Táticas</h3>
                    <div id="lista-cartas-taticas" class="space-y-2 max-h-[180px] overflow-y-auto pr-1"></div>
                </div>

                <div id="jogo-card-container" class="card-flip w-full h-[470px] cursor-pointer hidden"></div>
            </div>
        </section>
    </main>

    <script src="jogo.js"></script>
</body>
</html>
